[project]
name = "go2-next-reflex"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "cbor2>=6.3.0",
    "matplotlib>=3.11.2",
    "numpy>=2.2.6",        # riverops pins numpy ~=2.2.6
    "pyyaml>=6",
]

[dependency-groups]
# SNN training: `uv sync --group train` (needs data/riverops-0.2.0-py3-none-any.whl, which is
# proprietary and must not be committed; download it from riversdk.dev).
train = [
    "torch~=2.14.0",
    "riverops==0.2.0",
]

[tool.uv]
# uv-managed Python builds include tkinter, so matplotlib can open windows.
python-preference = "only-managed"

[tool.uv.sources]
riverops = { path = "data/riverops-0.2.0-py3-none-any.whl" }
