# Control for sew_resnet.yaml: the same 8 layers without the shortcuts (the "plain net" of the SEW-ResNet
# ablation, Fang et al. 2021). The difference between the two isolates the effect of the spike shortcuts.
base: ../motion_buddy_80_v4.yaml
name: lit_plain_deep

model:
  layers:                      # 80 → 19 → 19 → 19 → 9 → 9 → 9 → 2 → 1
    - {out: 16, kernel: 5, padding: 1, pool: 4}
    - {out: 16, kernel: 3, padding: 1}
    - {out: 16, kernel: 3, padding: 1}
    - {out: 16, kernel: 5, padding: 2, pool: 2}
    - {out: 16, kernel: 3, padding: 1}
    - {out: 16, kernel: 3, padding: 1}
    - {out: 128, kernel: 5, padding: 0, pool: 2}
    - {out: classes, kernel: 2}
  dropout_layers: [1, 2, 3, 4, 5, 6]
